[project]
name = "yas-api"
version = "0.1.0"
description = "API do catalogo e painel administrativo da Yas Embalagens"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.35",
    "fastapi[standard]>=0.116",
    "pydantic-settings>=2.10",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.41",
]

[project.scripts]
yas-create-admin = "yas_api.cli:create_admin"
yas-seed = "yas_api.seed:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yas_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
